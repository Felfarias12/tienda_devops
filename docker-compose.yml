services:
  frontend:
    build: ./frontend
    container_name: tienda-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tienda-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  backend:
    build: ./backend
    container_name: tienda-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      # La contraseña real va en un archivo .env (fuera de Git) o en un secret de GitHub
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: tienda_perritos
      DB_PORT: 3306
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    # Usa Node para no depender de que la imagen tenga curl o wget
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tienda-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  db:
    image: mysql:8
    container_name: tienda-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: tienda_perritos
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tienda-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  dbdata:

networks:
  tienda-net:
    driver: bridge