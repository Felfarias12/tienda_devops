name: CI/CD - Backend Tienda

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'db/**'
      - 'monitoring/**'
      - 'docker-compose.yml'
      - '.github/workflows/cicd-tienda-backend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'db/**'
      - 'monitoring/**'
      - 'docker-compose.yml'
      - '.github/workflows/cicd-tienda-backend.yml'
  workflow_dispatch:

# En PR se cancela la ejecución anterior; en main nunca, para no cortar un despliegue a medias
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

jobs:
  # ---------------------------------------------------------------
  # 1. Pruebas unitarias + cobertura (IE3, IE5)
  #    Entrega el % de cobertura al dashboard y falla bajo el umbral de jest.
  # ---------------------------------------------------------------
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.pct }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Falla si no existe el script "test" o si baja del umbral de cobertura
      - name: Ejecutar pruebas con cobertura
        run: npm test

      # Lee el resumen que genera el reporter json-summary de jest
      - name: Extraer porcentaje de cobertura
        id: cov
        run: echo "pct=$(jq -r '.total.lines.pct // 0' coverage/coverage-summary.json)" >> "$GITHUB_OUTPUT"

      # lcov.info lo consume SonarCloud en el job "sonar"
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 2. Seguridad de dependencias (IE5, IE6). Si falla, se bloquea el pipeline
  # ---------------------------------------------------------------
  security:
    name: Snyk y npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      # Compuerta sin token: falla (exit 1) ante vulnerabilidades altas o críticas
      # en dependencias de producción (--omit=dev excluye jest/supertest)
      - name: npm audit (severidad alta o superior)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      # Requiere el secreto SNYK_TOKEN. Bloquea ante severidad alta o superior
      # y deja el informe real en JSON como evidencia.
      - name: Snyk - análisis de dependencias
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/package.json --severity-threshold=high --json-file-output=snyk-report.json

      - name: Publicar informe de Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 3. Calidad de código con SonarCloud (IE5, IE6)
  #    Usa la cobertura del job "test". Si el quality gate falla, bloquea.
  # ---------------------------------------------------------------
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo para atribuir líneas

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage

      - name: Análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=Felfarias12_tienda_devops
            -Dsonar.organization=felfarias12
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.exclusions=node_modules/**,coverage/**,tests/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------
  # 4. Construcción y publicación de la imagen Docker (IE2, IE6)
  #    Solo corre si test, security y sonar pasan: así se detiene el pipeline.
  # ---------------------------------------------------------------
  build:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: [test, security, sonar]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action pasa el nombre a minúsculas, como exige GHCR
      - name: Generar tags de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (y push fuera de los PR)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 5. Despliegue simulado en el runner + smoke test (IE2)
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue simulado
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Usa la imagen publicada con el SHA del commit, no una construida de nuevo
      - name: Preparar override con la imagen del commit
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          cat > docker-compose.deploy.yml <<EOF
          services:
            backend:
              image: ${IMAGE_LC}:${GITHUB_SHA}
              pull_policy: always
          EOF
          echo "Imagen a desplegar: ${IMAGE_LC}:${GITHUB_SHA}"

      - name: Levantar base de datos y backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull backend
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build db backend

      - name: Smoke test - /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then
              echo ""
              echo "Backend saludable (intento $i)"
              exit 0
            fi
            echo "Esperando al backend... ($i/30)"
            sleep 5
          done
          echo "El backend no respondió a tiempo"
          exit 1

      # MySQL tarda más en inicializar que el backend; se reintenta hasta 60 s
      - name: Smoke test - /api/productos (conexión a la base de datos)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:3001/api/productos > /dev/null; then
              echo "Consulta a la base de datos OK (intento $i)"
              exit 0
            fi
            echo "Esperando a la base de datos... ($i/12)"
            sleep 5
          done
          echo "El backend no pudo consultar la base de datos"
          exit 1

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml logs --tail=100

      - name: Resumen de trazabilidad
        if: always()
        run: |
          {
            echo "### Trazabilidad del despliegue (backend, simulado)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Autor: ${GITHUB_ACTOR}"
            echo "- Rama: ${GITHUB_REF_NAME}"
            echo "- Imagen: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar entorno simulado
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml down -v

  # ---------------------------------------------------------------
  # 6. Despliegue en AWS Academy (EC2 por SSH) con monitoreo en CloudWatch
  #    (IE1, IE2, IE3). Solo en main, después del despliegue simulado.
  #    Necesita "test" en needs para leer el % de cobertura.
  # ---------------------------------------------------------------
  deploy-aws:
    name: Despliegue en AWS Academy
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      # Hora de inicio para medir la duración del despliegue
      - name: Marcar inicio
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar acceso SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # Misma imagen del commit que el despliegue simulado, más el envío de logs a CloudWatch
      - name: Preparar override con la imagen del commit y logs a CloudWatch
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          cat > docker-compose.aws.yml <<EOF
          services:
            backend:
              image: ${IMAGE_LC}:${GITHUB_SHA}
              pull_policy: always
              restart: unless-stopped
              logging:
                driver: awslogs
                options:
                  awslogs-region: us-east-1
                  awslogs-create-group: "true"
                  awslogs-group: /tienda/backend
            db:
              logging:
                driver: awslogs
                options:
                  awslogs-region: us-east-1
                  awslogs-create-group: "true"
                  awslogs-group: /tienda/db
            frontend:
              logging:
                driver: awslogs
                options:
                  awslogs-region: us-east-1
                  awslogs-create-group: "true"
                  awslogs-group: /tienda/frontend
          EOF
          echo "Imagen a desplegar en AWS: ${IMAGE_LC}:${GITHUB_SHA}"

      - name: Copiar archivos de despliegue a la EC2
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p ~/tienda"
          scp -i ~/.ssh/ec2_key docker-compose.yml docker-compose.aws.yml "$EC2_USER@$EC2_HOST:~/tienda/"
          scp -r -i ~/.ssh/ec2_key db "$EC2_USER@$EC2_HOST:~/tienda/"
          scp -r -i ~/.ssh/ec2_key monitoring "$EC2_USER@$EC2_HOST:~/tienda/"

      # La contraseña viaja por stdin: no queda en los logs ni en el repositorio
      - name: Crear .env con la contraseña de la base de datos
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD" || { echo "Falta el secret DB_PASSWORD"; exit 1; }
          printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" \
            | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "umask 077 && cat > ~/tienda/.env"

      - name: Desplegar en la EC2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '$GH_USER' --password-stdin"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s <<'REMOTE'
          set -e
          cd ~/tienda
          F="-f docker-compose.yml -f docker-compose.aws.yml"
          docker compose $F pull backend
          docker compose $F up -d --no-build db backend
          docker image prune -f
          docker logout ghcr.io
          REMOTE

      - name: Smoke test en AWS - /api/health
        run: |
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "curl -fsS http://localhost:3001/api/health"; then
              echo ""
              echo "Backend saludable en AWS (intento $i)"
              exit 0
            fi
            echo "Esperando al backend en AWS... ($i/12)"
            sleep 5
          done
          echo "El backend no respondió a tiempo en AWS"
          exit 1

      # Instala el agente, el cron de métricas, el filtro de errores, las alarmas y el dashboard
      - name: Configurar CloudWatch
        run: ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "bash ~/tienda/monitoring/setup-cloudwatch.sh"

      # Alimenta los widgets "Tiempo de despliegue" y "Cobertura" del dashboard
      - name: Publicar métricas del pipeline
        if: success()
        env:
          COVERAGE: ${{ needs.test.outputs.coverage }}
        run: |
          DURATION=$(( $(date +%s) - START ))
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "
            aws cloudwatch put-metric-data --region us-east-1 --namespace Tienda/CICD \
              --metric-name DeployDurationSeconds --value $DURATION --unit Seconds
            aws cloudwatch put-metric-data --region us-east-1 --namespace Tienda/CICD \
              --metric-name TestCoveragePercent --value ${COVERAGE:-0} --unit Percent"

      - name: Mostrar logs si falla
        if: failure()
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "cd ~/tienda && docker compose -f docker-compose.yml -f docker-compose.aws.yml logs --tail=100" || true

      - name: Resumen de trazabilidad (AWS)
        if: always()
        run: |
          {
            echo "### Trazabilidad del despliegue en AWS Academy"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Autor: ${GITHUB_ACTOR}"
            echo "- Rama: ${GITHUB_REF_NAME}"
            echo "- Imagen: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"