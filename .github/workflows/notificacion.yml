name: CI Simple - Notificacion
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: mostrar mensaje en consola
        run: |
          echo "---------------------------------------------"
          echo "push detectado en el repositorio"
          echo "rama origen: ${{ github.ref_name }}"
          echo "autor del commit: ${{ github.actor }}"
          echo "----------------------------------------------"