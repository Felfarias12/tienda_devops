name: CI/CD - Frontend Tienda

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/cicd-tienda-frontend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/cicd-tienda-frontend.yml'
  workflow_dispatch:

# En PR se cancela la ejecución anterior; en main nunca, para no cortar un despliegue a medias
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ---------------------------------------------------------------
  # 1. Validaciones estáticas: sintaxis de JS y buenas prácticas del Dockerfile
  # ---------------------------------------------------------------
  lint:
    name: Validar código y Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Falla si app.js tiene errores de sintaxis
      - name: Verificar sintaxis de app.js
        run: |
          cp frontend/app.js "${RUNNER_TEMP}/app-check.mjs"
          node --check "${RUNNER_TEMP}/app-check.mjs"
          echo "Sintaxis de app.js correcta"

      - name: Verificar archivos esenciales
        run: |
          for f in frontend/index.html frontend/app.js frontend/default.conf frontend/Dockerfile; do
            test -f "$f" || { echo "Falta $f"; exit 1; }
          done

      # Falla ante problemas de severidad "error" en el Dockerfile
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

  # ---------------------------------------------------------------
  # 2. Construcción, escaneo de seguridad y publicación de la imagen
  #    Si Trivy encuentra vulnerabilidades altas o críticas, no se publica nada
  # ---------------------------------------------------------------
  build:
    name: Construir, escanear y publicar imagen
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # Imagen local solo para escanear (no se publica)
      - name: Construir imagen para escaneo
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: frontend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - escaneo de la imagen (bloquea si hay altas o críticas)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar tags de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publicar imagen (solo fuera de los PR)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ---------------------------------------------------------------
  # 3. Despliegue simulado en el runner + smoke test
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue simulado
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar el frontend con la imagen del commit
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "Imagen a desplegar: ${IMAGE_LC}:${GITHUB_SHA}"
          docker pull "${IMAGE_LC}:${GITHUB_SHA}"
          docker run -d --name frontend -p 8080:80 "${IMAGE_LC}:${GITHUB_SHA}"

      - name: Smoke test - página principal
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Frontend responde (intento $i)"
              exit 0
            fi
            echo "Esperando al frontend... ($i/15)"
            sleep 4
          done
          echo "El frontend no respondió a tiempo"
          exit 1

      - name: Mostrar logs si falla
        if: failure()
        run: docker logs frontend

      - name: Limpiar entorno simulado
        if: always()
        run: docker rm -f frontend

  # ---------------------------------------------------------------
  # 4. Despliegue en AWS Academy (EC2 por SSH)
  # ---------------------------------------------------------------
  deploy-aws:
    name: Despliegue en AWS Academy
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Configurar acceso SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Calcular imagen del commit
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REF=${IMAGE_LC}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "Imagen a desplegar en AWS: ${IMAGE_LC}:${GITHUB_SHA}"

      - name: Desplegar en la EC2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '$GH_USER' --password-stdin"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s -- "$IMAGE_REF" <<'REMOTE'
          set -e
          IMAGE="$1"
          docker pull "$IMAGE"
          docker rm -f frontend 2>/dev/null || true
          # Une el frontend a la red del backend para que nginx resuelva "backend"
          NET=""
          BID="$(docker ps -q --filter name=tienda-backend | head -n 1)"
          if [ -z "$BID" ]; then
            BID="$(docker ps -q --filter label=com.docker.compose.service=backend | head -n 1)"
          fi
          if [ -n "$BID" ]; then
            NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$BID" | awk '{print $1}')"
          fi
          if [ -z "$NET" ] && docker network inspect tienda_default > /dev/null 2>&1; then
            NET="tienda_default"
          fi
          if [ -z "$NET" ]; then
            echo "ERROR: no se encontró la red del backend. Despliega primero el backend."
            exit 1
          fi
          echo "Red del backend: $NET"
          docker run -d --name frontend --restart unless-stopped --network "$NET" -p 80:80 "$IMAGE"
          docker image prune -f
          docker logout ghcr.io
          REMOTE

      - name: Smoke test en AWS
        run: |
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "curl -fsS http://localhost/ > /dev/null"; then
              echo "Frontend saludable en AWS (intento $i)"
              exit 0
            fi
            echo "Esperando al frontend en AWS... ($i/12)"
            sleep 5
          done
          echo "El frontend no respondió a tiempo en AWS"
          exit 1

      # Comprueba que nginx llega al backend (evita dejar publicado un frontend que da 502)
      - name: Smoke test en AWS - proxy hacia el backend
        run: |
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "curl -fsS http://localhost/api/health"; then
              echo ""
              echo "El frontend llega al backend (intento $i)"
              exit 0
            fi
            echo "Esperando al proxy... ($i/12)"
            sleep 5
          done
          echo "El frontend no logra comunicarse con el backend"
          exit 1

      - name: Mostrar logs si falla
        if: failure()
        run: ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "docker logs --tail=100 frontend"

      - name: Resumen de trazabilidad
        if: always()
        run: |
          {
            echo "### Trazabilidad del despliegue (frontend, AWS Academy)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Autor: ${GITHUB_ACTOR}"
            echo "- Rama: ${GITHUB_REF_NAME}"
            echo "- Imagen: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"