name: CI/CD - Frontend Tienda

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/cicd-tienda-frontend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/cicd-tienda-frontend.yml'
  workflow_dispatch:

# En PR se cancela la ejecución anterior; en main nunca, para no cortar un despliegue a medias
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ---------------------------------------------------------------
  # 1. Calidad: lint, pruebas y compilación del frontend
  # ---------------------------------------------------------------
  test:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # --if-present: no falla si el proyecto aún no define ese script
      - name: Lint
        run: npm run lint --if-present

      - name: Pruebas unitarias
        run: npm test --if-present

      - name: Compilar (build de producción)
        run: npm run build

  # ---------------------------------------------------------------
  # 2. Seguridad de dependencias. Si falla, se bloquea el pipeline
  # ---------------------------------------------------------------
  security:
    name: Snyk y npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: npm audit (severidad alta o superior)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Snyk - análisis de dependencias
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=frontend/package.json --severity-threshold=high --json-file-output=snyk-frontend-report.json

      - name: Publicar informe de Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-frontend-report
          path: snyk-frontend-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 3. Construcción y publicación de la imagen Docker
  # ---------------------------------------------------------------
  build:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar tags de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      # VITE_API_URL: URL pública del backend (variable de Actions, ver instrucciones).
      # Si tu frontend no usa esa variable, el argumento se ignora.
      - name: Build (y push fuera de los PR)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 4. Despliegue simulado en el runner + smoke test
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue simulado
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar el frontend con la imagen del commit
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "Imagen a desplegar: ${IMAGE_LC}:${GITHUB_SHA}"
          docker pull "${IMAGE_LC}:${GITHUB_SHA}"
          docker run -d --name frontend -p 8080:80 "${IMAGE_LC}:${GITHUB_SHA}"

      - name: Smoke test - página principal
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Frontend responde (intento $i)"
              exit 0
            fi
            echo "Esperando al frontend... ($i/15)"
            sleep 4
          done
          echo "El frontend no respondió a tiempo"
          exit 1

      - name: Mostrar logs si falla
        if: failure()
        run: docker logs frontend

      - name: Limpiar entorno simulado
        if: always()
        run: docker rm -f frontend

  # ---------------------------------------------------------------
  # 5. Despliegue en AWS Academy (EC2 por SSH)
  # ---------------------------------------------------------------
  deploy-aws:
    name: Despliegue en AWS Academy
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Configurar acceso SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Calcular imagen del commit
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REF=${IMAGE_LC}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "Imagen a desplegar en AWS: ${IMAGE_LC}:${GITHUB_SHA}"

      - name: Desplegar en la EC2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '$GH_USER' --password-stdin"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s -- "$IMAGE_REF" <<'REMOTE'
          set -e
          IMAGE="$1"
          docker pull "$IMAGE"
          docker rm -f frontend 2>/dev/null || true
          docker run -d --name frontend --restart unless-stopped -p 80:80 "$IMAGE"
          docker image prune -f
          docker logout ghcr.io
          REMOTE

      - name: Smoke test en AWS
        run: |
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "curl -fsS http://localhost/ > /dev/null"; then
              echo "Frontend saludable en AWS (intento $i)"
              exit 0
            fi
            echo "Esperando al frontend en AWS... ($i/12)"
            sleep 5
          done
          echo "El frontend no respondió a tiempo en AWS"
          exit 1

      - name: Mostrar logs si falla
        if: failure()
        run: ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "docker logs --tail=100 frontend"

      - name: Resumen de trazabilidad
        if: always()
        run: |
          {
            echo "### Trazabilidad del despliegue (frontend, AWS Academy)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Autor: ${GITHUB_ACTOR}"
            echo "- Rama: ${GITHUB_REF_NAME}"
            echo "- Imagen: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"