name: CI/CD - Frontend Tienda

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/cicd-tienda-front.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/cicd-tienda-front.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ---------------------------------------------------------------
  # 1. Análisis estático del Dockerfile (IE1, IE3)
  # ---------------------------------------------------------------
  lint:
    name: Lint del Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Falla ante advertencias o errores (buenas prácticas de imagen)
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  # ---------------------------------------------------------------
  # 2. Build, validación de nginx, escaneo de vulnerabilidades y push
  #    (IE1, IE2, IE3, IE4)
  # ---------------------------------------------------------------
  build:
    name: Construir, escanear y publicar imagen
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # GHCR exige el nombre de la imagen en minúsculas
      - name: Normalizar nombre de imagen
        run: echo "IMAGE_LC=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local (sin push) para validar
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: ${{ env.IMAGE_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prueba de calidad: la configuración de nginx debe ser válida.
      # backend se mapea a 127.0.0.1 porque nginx resuelve el upstream al arrancar.
      - name: Validar configuración de nginx
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            "${IMAGE_LC}:${GITHUB_SHA}" nginx -t

      # Bloquea el pipeline (exit-code 1) ante vulnerabilidades altas o críticas
      - name: Trivy - escaneo de vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_LC }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen (solo en push a main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_LC }}:${{ github.sha }}
            ${{ env.IMAGE_LC }}:latest
          cache-from: type=gha

  # ---------------------------------------------------------------
  # 3. Despliegue simulado del stack completo + smoke tests (IE4, IE5)
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue simulado
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El frontend usa la imagen publicada con el SHA del commit
      - name: Preparar override con la imagen del commit
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          cat > docker-compose.deploy.yml <<EOF
          services:
            frontend:
              image: ${IMAGE_LC}:${GITHUB_SHA}
              pull_policy: always
          EOF
          echo "Imagen a desplegar: ${IMAGE_LC}:${GITHUB_SHA}"

      # nginx necesita que el servicio "backend" exista, así que se levanta el stack completo
      - name: Levantar stack (db, backend y frontend)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.deploy.yml"
          $COMPOSE pull frontend
          $COMPOSE build backend
          $COMPOSE up -d --no-build

      - name: Smoke test - frontend sirve index.html
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ | grep -qi "<html"; then
              echo "Frontend responde (intento $i)"
              exit 0
            fi
            echo "Esperando al frontend... ($i/30)"
            sleep 5
          done
          echo "El frontend no respondió a tiempo"
          exit 1

      # Verifica el proxy nginx -> backend
      - name: Smoke test - proxy /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              echo ""
              echo "Proxy hacia el backend OK (intento $i)"
              exit 0
            fi
            echo "Esperando al backend... ($i/30)"
            sleep 5
          done
          echo "El proxy no alcanzó al backend"
          exit 1

      # Verifica la cadena completa frontend -> backend -> MySQL
      - name: Smoke test - /api/productos (base de datos)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:8080/api/productos > /dev/null; then
              echo "Cadena completa OK (intento $i)"
              exit 0
            fi
            echo "Esperando a la base de datos... ($i/12)"
            sleep 5
          done
          echo "No se pudo consultar la base de datos a través del frontend"
          exit 1

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml logs --tail=100

      - name: Resumen de trazabilidad
        if: always()
        run: |
          {
            echo "### Trazabilidad del despliegue (frontend)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Autor: ${GITHUB_ACTOR}"
            echo "- Rama: ${GITHUB_REF_NAME}"
            echo "- Imagen: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar entorno simulado
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml down -v