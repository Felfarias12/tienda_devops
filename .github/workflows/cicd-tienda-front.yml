name: GitFlow - CI/CD Tienda DevOps - Frontend(pull request)
on:
  push:
    branches: [ "desarrollo_front" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
      - 'backend/**'
      - 'db/**'

    permissions:
      contents: read
      pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test
      - run: npm run build

  auto-pr:
  needs: test
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - name: Definir rama base según GitFlow
      id: vars
      run: |
        BRANCH="${GITHUB_REF#refs/heads/}"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$BRANCH" == desarrollo_front/* ]]; then
            echo "base=main" >> "$GITHUB_OUTPUT"
          else
            echo "base=develop" >> "$GITHUB_OUTPUT"
          fi

    - name: Crear PR si no existe
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
          BRANCH="${{ steps.vars.outputs.branch }}"
          BASE="${{ steps.vars.outputs.base }}"

          # Evita duplicados: revisa si ya existe un PR abierto para esta rama
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE" --json number --jq '. | length')

          if [ "$EXISTING" -eq 0 ]; then
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "$BRANCH → $BASE" \
              --body "PR generado automáticamente por CI tras el push a \`$BRANCH\`." \
              --label "auto-pr"
          else
            echo "Ya existe un PR abierto para esta rama, no se crea otro."
          fi